<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarJju QUIZ</title>
<style>
  :root{
    --sky-top:#ffd7e8;
    --sky-bottom:#ffeef6;
    --ink:#8a3b58;
    --accent:#ff6fa8;
    --error:#e0527a;
    --paper:#fff7fb;
    --love:#ff3d78;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.55) 0px, rgba(255,255,255,0.55) 14px, transparent 14px, transparent 28px),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    color:var(--ink);
    overflow:hidden;
  }
  #stage{
    height:100%;
    width:100%;
    position:relative;
    z-index:1;
  }
  .bg-photo{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    opacity:0;
    transition:opacity 1s ease;
  }
  .bg-photo.active{
    opacity:1;
  }
  .bg-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    filter:grayscale(100%) contrast(1.05);
    opacity:0.1;
  }
  .bg-photo::after{
    content:"";
    position:absolute;
    inset:0;
    background:var(--love);
    mix-blend-mode:color;
    opacity:0.45;
  }
  #hearts{
    position:fixed;
    inset:0;
    z-index:2;
    overflow:hidden;
    pointer-events:none;
  }
  .heart{
    position:absolute;
    bottom:-10vh;
    color:#ffffff;
    opacity:0;
    line-height:1;
    animation-name:floatUp;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
    will-change:transform, opacity;
  }
  @keyframes floatUp{
    0%{ transform:translate(0, 0) rotate(0deg); opacity:0; }
    8%{ opacity:var(--peak-opacity, 0.35); }
    90%{ opacity:var(--peak-opacity, 0.35); }
    100%{ transform:translate(var(--drift), -115vh) rotate(var(--rot)); opacity:0; }
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease;
  }
  .slide.active{
    opacity:1;
    pointer-events:auto;
  }

  /* ---- Question slides (Martin / Juhoon trivia) ---- */
  .question{
    font-size:1.15rem;
    margin-bottom:18px;
    text-align:center;
    font-weight:600;
  }
  /* ---- Kawaii pink "chat window" quiz card ---- */
  .quiz-card{
    width:min(88vw, 380px);
    background:var(--paper);
    border:3px solid #ffc2dc;
    border-radius:20px;
    box-shadow:0 10px 28px rgba(255,111,168,0.28);
    padding:20px 18px 22px;
    position:relative;
  }
  .quiz-card-bar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin:-4px -2px 14px 0;
  }
  .qc-dot{
    width:16px;
    height:16px;
    border-radius:50%;
    display:inline-block;
    box-shadow:inset 0 -2px 2px rgba(0,0,0,0.08);
  }
  .qc-dot-1{ background:#ffd76a; }
  .qc-dot-2{ background:#ff9dc4; }
  .qc-dot-3{ background:#8fd0f0; }
  .quiz-card .question{
    color:var(--ink);
  }
  .quiz-card .mc-option{
    border-radius:20px;
    border-color:#ffd0e4;
    background:#fff0f6;
    box-shadow:0 3px 0 #ffd0e4;
  }
  .quiz-card .mc-option:hover:not(:disabled){
    border-color:var(--accent);
  }
  .quiz-card .mc-option.correct{
    background:var(--accent);
    border-color:var(--accent);
    box-shadow:0 3px 0 #d1477f;
  }

  .answer-row{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .mc-options{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:min(80vw, 340px);
  }
  .mc-option{
    font-family:inherit;
    font-size:1rem;
    font-weight:600;
    padding:14px 18px;
    border-radius:14px;
    border:2px solid #cfd9d1;
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    text-align:left;
    transition:transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .mc-option:hover:not(:disabled){
    border-color:var(--accent);
  }
  .mc-option:active:not(:disabled){
    transform:scale(0.98);
  }
  .mc-option:disabled{
    cursor:default;
  }
  .mc-option.correct{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .mc-option.wrong{
    border-color:var(--error);
    color:var(--error);
  }
  .feedback{
    margin-top:16px;
    min-height:1.4em;
    font-size:1rem;
  }
  .feedback.correct{ color:var(--accent); font-weight:600; }
  .feedback.wrong{ color:var(--error); }

  @keyframes shake{
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  .shake{
    animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    border-color: var(--error) !important;
  }

  /* ---- Slide: word fade-in ---- */
  #reveal-text{
    font-size:clamp(1.6rem, 5vw, 2.6rem);
    text-align:center;
    line-height:1.4;
    font-weight:600;
  }
  #reveal-text .word{
    display:inline-block;
    opacity:0;
    transform:translateY(10px);
    filter:blur(2px);
    transition:opacity 0.6s ease, transform 0.6s ease, filter 0.6s ease;
  }
  #reveal-text .word.shown{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
  #reveal-text .word.fading-out{
    opacity:0 !important;
    transition:opacity 0.9s ease;
  }
  #reveal-text .word.spacer{
    margin-right:0.28em;
  }
  #reveal-text .love-word{
    color:var(--love);
    font-weight:700;
  }
  #reveal-text .bird-word{
    color:var(--accent);
    font-weight:700;
  }
  #reveal-text .glue-word{
    margin-left:0;
  }
  #reveal-text .word.ghost{
    opacity:0;
    transition:none;
  }

  /* ---- Slide: love flies in and settles into new headline ---- */
  #final-wrap{
    position:relative;
    text-align:center;
    min-height:160px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  #final-headline{
    font-size:clamp(1.8rem, 6vw, 3rem);
    display:flex;
    align-items:baseline;
    gap:0.3em;
    flex-wrap:wrap;
    justify-content:center;
    font-weight:700;
  }
  #final-headline span{
    opacity:0;
    transform:translateY(14px);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  #final-headline span.shown{
    opacity:1;
    transform:translateY(0);
  }
  #final-headline .love-final{
    color:var(--love);
  }
  #final-headline .bird-final{
    color:var(--accent);
  }
  #subline{
    margin-top:14px;
    font-size:1rem;
    color:#5c6b60;
    opacity:0;
    transition:opacity 1s ease;
  }
  #subline.shown{
    opacity:1;
  }
  #subline2{
    margin-top:6px;
    font-size:0.9rem;
    color:#5c6b60;
    opacity:0;
    transition:opacity 1s ease;
  }
  #subline2.shown{
    opacity:1;
  }

  /* ---- Finale: blackout, confetti, danmaku, disco, gifs ---- */
  #finale{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.6s ease;
    overflow:hidden;
  }
  #finale.active{
    opacity:1;
    pointer-events:auto;
  }
  #disco-layer, #gif-layer, #confetti-layer, #danmaku-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .then-now-wrap{
    position:absolute;
    inset:0;
    z-index:150;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:0 32px;
    pointer-events:none;
  }
  .then-now-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    transition:opacity 0.6s ease;
  }
  .then-now-item.shown{
    opacity:1;
  }
  .then-now-item img,
  .then-now-item .now-media{
    width:min(58vw, 320px);
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:16px;
    background:#000;
    transition:transform 0.8s ease;
  }
  .then-now-item.shrunk .now-media{
    transform:scale(0.5);
  }
  .then-now-item .label{
    margin-top:16px;
    color:#fff;
    font-size:1.2rem;
    font-weight:600;
    text-align:center;
    max-width:80vw;
  }
  #disco-layer{
    background:conic-gradient(from 0deg, #ff004c, #ffb400, #38ff8a, #00d4ff, #7b2ff7, #ff004c);
    mix-blend-mode:screen;
    opacity:0;
    animation:discoSpin 6s linear infinite;
    transform-origin:center;
    transition:opacity 1s ease;
    will-change:transform;
  }
  #disco-layer.active{
    opacity:0.35;
  }
  #disco-layer::after{
    content:"";
    position:absolute;
    inset:-20%;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.28), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.22), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(255,255,255,0.18), transparent 35%);
    animation:discoPulse 2.6s ease-in-out infinite alternate;
  }
  @keyframes discoSpin{
    from{ transform:rotate(0deg) scale(1.5); }
    to{ transform:rotate(360deg) scale(1.5); }
  }
  @keyframes discoPulse{
    from{ opacity:0.25; }
    to{ opacity:0.75; }
  }
  .gif-slot{
    position:absolute;
    opacity:0;
    transition:opacity 0.6s ease;
    border-radius:14px;
    box-shadow:0 12px 34px rgba(0,0,0,0.55);
  }
  .confetti-piece{
    position:absolute;
    top:-6vh;
    opacity:0;
    animation-name:confettiFall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:1; }
    100%{ transform:translate(var(--drift), 115vh) rotate(var(--rot)); opacity:0; }
  }
  .danmaku-item{
    position:absolute;
    left:-25%;
    white-space:nowrap;
    font-weight:800;
    text-shadow:0 0 10px rgba(0,0,0,0.6), 0 0 2px rgba(0,0,0,0.8);
    animation-name:danmakuMove;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes danmakuMove{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(150vw); }
  }

  /* the flying clones of "love" and "bird" that travel between slides */
  .word-flyer{
    position:fixed;
    top:0;
    left:0;
    margin:0;
    padding:0;
    font-weight:700;
    white-space:nowrap;
    pointer-events:none;
    z-index:50;
    transform-origin:top left;
    transition:top 1.9s cubic-bezier(.5,0,.2,1), left 1.9s cubic-bezier(.5,0,.2,1), font-size 1.9s cubic-bezier(.5,0,.2,1);
  }
  #love-flyer{ color:var(--love); }
  #bird-flyer{ color:var(--accent); }
</style>
</head>

  <source src="https://raw.githubusercontent.com/phuongm1409/bird/main/bgm.mp3" type="audio/mpeg">

<div id="finale">
  <div id="then-now" class="then-now-wrap">
    <div class="then-now-item" id="now-item">
      <video id="now-video" class="now-media" src="loopy.mp4" playsinline webkit-playsinline autoplay preload="auto"></video>
      <div class="label">Today, we celebrate your birthday.</div>
    </div>
  </div>
  <div id="disco-layer"></div>
  <div id="gif-layer">
    <img class="gif-slot" alt="">
    <img class="gif-slot" alt="">
    <img class="gif-slot" alt="">
    <img class="gif-slot" alt="">
  </div>
  <div id="confetti-layer"></div>
  <div id="danmaku-layer"></div>
</div>
<div id="stage">

  <!-- SLIDE: Question 1 - Sparrow -->
  <div class="slide active" id="slide-q1">
    <div class="quiz-card">
      <div class="quiz-card-bar"><span class="qc-dot qc-dot-1"></span><span class="qc-dot qc-dot-2"></span><span class="qc-dot qc-dot-3"></span></div>
      <div class="question">Where did Juhoon go right after coming home?</div>
      <div class="mc-options">
        <button class="mc-option">Into the bathroom</button>
        <button class="mc-option">Into the kitchen to eat</button>
        <button class="mc-option" data-correct="true">Into Martin's room</button>
        <button class="mc-option">Into bed to sleep</button>
      </div>
      <div class="feedback"></div>
    </div>
  </div>

  <!-- SLIDE: Question 2 - Magpie -->
  <div class="slide" id="slide-q2">
    <div class="quiz-card">
      <div class="quiz-card-bar"><span class="qc-dot qc-dot-1"></span><span class="qc-dot qc-dot-2"></span><span class="qc-dot qc-dot-3"></span></div>
      <div class="question">Before becoming an idol, Juhoon used to be a...?</div>
      <div class="mc-options">
        <button class="mc-option">Child singer</button>
        <button class="mc-option" data-correct="true">Child model</button>
        <button class="mc-option">Child chef</button>
        <button class="mc-option">Child pilot</button>
      </div>
      <div class="feedback"></div>
    </div>
  </div>

  <!-- SLIDE: Question 3 - What are Martin and Juhoon to each other -->
  <div class="slide" id="slide-q3">
    <div class="quiz-card">
      <div class="quiz-card-bar"><span class="qc-dot qc-dot-1"></span><span class="qc-dot qc-dot-2"></span><span class="qc-dot qc-dot-3"></span></div>
      <div class="question">What are Martin and Juhoon to each other?</div>
      <div class="mc-options">
        <button class="mc-option">Just members of the same group</button>
        <button class="mc-option" data-correct="true">Lovebirds</button>
        <button class="mc-option">Biological siblings</button>
      </div>
      <div class="feedback"></div>
    </div>
  </div>

  <!-- SLIDE: They are... lovebirds -->
  <div class="slide" id="slide-2">
    <div id="reveal-text"></div>
  </div>

  <!-- SLIDE: Happy Birthday with love -->
  <div class="slide" id="slide-3">
    <div id="final-wrap">
      <div id="final-headline"></div>
      <div id="subline"></div>
      <div id="subline2"></div>
    </div>
  </div>

</div>

<script>
(function(){
  const slide2 = document.getElementById('slide-2');
  const slide3 = document.getElementById('slide-3');
  const bgm = document.getElementById('bgm');

  // ---------- Question flow config ----------
  // each question: which slide it lives on, and what happens next once answered correctly
  const questions = [
    {
      slideId: 'slide-q1',
      correctMsg: "Correct!",
      next: () => goToSlide('slide-q2')
    },
    {
      slideId: 'slide-q2',
      correctMsg: "Correct!",
      next: () => goToSlide('slide-q3')
    },
    {
      slideId: 'slide-q3',
      correctMsg: "Correct!",
      next: () => {
        startHearts();
        goToSlide('slide-2');
        startWordReveal();
      }
    }
  ];

  function goToSlide(id){
    document.querySelectorAll('.slide.active').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  questions.forEach(q => {
    const slideEl = document.getElementById(q.slideId);
    const options = Array.from(slideEl.querySelectorAll('.mc-option'));
    const feedback = slideEl.querySelector('.feedback');

    function handleChoice(chosenBtn){
      const isCorrect = chosenBtn.dataset.correct === 'true';
      if(isCorrect){
        options.forEach(o => o.disabled = true);
        chosenBtn.classList.add('correct');
        feedback.textContent = q.correctMsg;
        feedback.className = 'feedback correct';
        setTimeout(q.next, 650);
      } else {
        chosenBtn.classList.remove('shake');
        void chosenBtn.offsetWidth;
        chosenBtn.classList.add('wrong', 'shake');
        setTimeout(()=> chosenBtn.classList.remove('shake'), 500);
        feedback.textContent = "That's not quite it — try again.";
        feedback.className = 'feedback wrong';
      }
    }

    options.forEach(btn => {
      btn.addEventListener('click', () => handleChoice(btn));
    });
  });

  // ---------- Floating hearts + bg music (start once bee-eaters answer is submitted) ----------
  let heartsTimer = null;
  function spawnHeart(){
    const layer = document.getElementById('hearts');
    if(layer.children.length >= 30) return; // hard cap to avoid runaway buildup

    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = '♥';

    const size = 14 + Math.random() * 22; // 14–36px
    const left = Math.random() * 100; // vw %
    const duration = 6 + Math.random() * 5; // 6–11s
    const drift = (Math.random() * 120 - 60) + 'px';
    const rot = (Math.random() * 40 - 20) + 'deg';
    const peakOpacity = 0.2 + Math.random() * 0.25; // 0.2–0.45

    el.style.left = left + 'vw';
    el.style.fontSize = size + 'px';
    el.style.animationDuration = duration + 's';
    el.style.setProperty('--drift', drift);
    el.style.setProperty('--rot', rot);
    el.style.setProperty('--peak-opacity', peakOpacity);

    document.getElementById('hearts').appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function startHearts(){
    if(heartsTimer) return;
    document.querySelector('.bg-photo').classList.add('active');
    spawnHeart();
    heartsTimer = setInterval(spawnHeart, 380);
    bgm.volume = 0.5;
    bgm.play().catch(()=>{ /* ignored if browser blocks autoplay */ });
  }

  // ---------- Slide: word-by-word fade in ----------
  let loveSourceEl = null;
  let birdSourceEl = null;

  function startWordReveal(){
    const container = document.getElementById('reveal-text');
    container.innerHTML = '';

    // "They" "are..." "love" "bird" "s." — love+bird+s sit glued together as "lovebirds."
    // "bird" is kept as its own word so it can later jump into "Birthday!" instead of vanishing.
    const specs = [
      { text: "They", glue:false, love:false, bird:false },
      { text: "are...", glue:false, love:false, bird:false },
      { text: "love", glue:false, love:true, bird:false },
      { text: "bird", glue:true, love:false, bird:true },
      { text: "s.", glue:true, love:false, bird:false }
    ];

    const wordEls = [];
    specs.forEach((s) => {
      const span = document.createElement('span');
      span.className = 'word';
      if(s.glue) span.classList.add('glue-word');
      if(s.love){
        span.classList.add('love-word');
        loveSourceEl = span;
      } else if(s.bird){
        span.classList.add('bird-word');
        birdSourceEl = span;
      } else if(!s.glue){
        span.classList.add('spacer');
      }
      span.textContent = s.text;
      container.appendChild(span);
      wordEls.push(span);
    });

    wordEls.forEach((el, i) => {
      setTimeout(()=> el.classList.add('shown'), 400 + i * 480);
    });

    const totalRevealTime = 400 + specs.length * 480;

    // hold, then fade everything out except "love" and "bird" (bird will jump to slide 3, not vanish)
    setTimeout(()=>{
      wordEls.forEach(el => {
        if(el !== loveSourceEl && el !== birdSourceEl){
          el.classList.add('fading-out');
        }
      });
    }, totalRevealTime + 1400);

    // once faded, fly "love" and "bird" over to slide 3
    setTimeout(()=>{
      flyLoveAndBirdToSlide3();
    }, totalRevealTime + 2000);
  }

  // ---------- Fly "love" and "bird" from slide 2 into slide 3's headline ----------
  // "bird" doesn't disappear — it jumps Bird -> Birdday -> Birthday! mid-flight (Bird/Birth wordplay).
  function flyLoveAndBirdToSlide3(){
    // 1) measure where "love" and "bird" currently sit
    const loveStartRect = loveSourceEl.getBoundingClientRect();
    const loveStartFontSize = window.getComputedStyle(loveSourceEl).fontSize;
    const birdStartRect = birdSourceEl.getBoundingClientRect();
    const birdStartFontSize = window.getComputedStyle(birdSourceEl).fontSize;

    // 2) build slide 3's headline (invisible spans, but laid out) so we can
    //    measure where "Birthday!" and "love." need to land
    const headline = document.getElementById('final-headline');
    headline.innerHTML = '';
    const subline = document.getElementById('subline');
    subline.classList.remove('shown');
    const subline2 = document.getElementById('subline2');
    subline2.classList.remove('shown');

    const parts = [
      { text: "Happy", cls: "" },
      { text: "Birthday!", cls: "bird-final" },
      { text: "with", cls: "" },
      { text: "love.", cls: "love-final" }
    ];
    let birdTargetEl = null;
    let loveTargetEl = null;
    parts.forEach(p => {
      const span = document.createElement('span');
      span.textContent = p.text;
      if(p.cls === 'bird-final'){
        span.classList.add(p.cls);
        birdTargetEl = span;
      } else if(p.cls === 'love-final'){
        span.classList.add(p.cls);
        loveTargetEl = span;
      }
      headline.appendChild(span);
    });

    // make slide 3 visible so layout resolves, but keep its words invisible for now
    slide3.classList.add('active');

    // 3) measure target positions (after layout)
    requestAnimationFrame(() => {
      const birdTargetRect = birdTargetEl.getBoundingClientRect();
      const birdTargetFontSize = window.getComputedStyle(birdTargetEl).fontSize;
      const loveTargetRect = loveTargetEl.getBoundingClientRect();
      const loveTargetFontSize = window.getComputedStyle(loveTargetEl).fontSize;

      // 4) create the flying clones at their current screen positions
      const loveFlyer = document.createElement('div');
      loveFlyer.id = 'love-flyer';
      loveFlyer.className = 'word-flyer';
      loveFlyer.textContent = 'love';
      loveFlyer.style.top = loveStartRect.top + 'px';
      loveFlyer.style.left = loveStartRect.left + 'px';
      loveFlyer.style.fontSize = loveStartFontSize;
      document.body.appendChild(loveFlyer);

      const birdFlyer = document.createElement('div');
      birdFlyer.id = 'bird-flyer';
      birdFlyer.className = 'word-flyer';
      birdFlyer.textContent = 'Bird';
      birdFlyer.style.top = birdStartRect.top + 'px';
      birdFlyer.style.left = birdStartRect.left + 'px';
      birdFlyer.style.fontSize = birdStartFontSize;
      document.body.appendChild(birdFlyer);

      // hide the originals so only the flyers are visible mid-flight
      loveSourceEl.classList.add('ghost');
      birdSourceEl.classList.add('ghost');
      slide2.classList.remove('active');

      // 5) next frame, animate the flyers to their target positions
      requestAnimationFrame(() => {
        loveFlyer.style.top = loveTargetRect.top + 'px';
        loveFlyer.style.left = loveTargetRect.left + 'px';
        loveFlyer.style.fontSize = loveTargetFontSize;

        birdFlyer.style.top = birdTargetRect.top + 'px';
        birdFlyer.style.left = birdTargetRect.left + 'px';
        birdFlyer.style.fontSize = birdTargetFontSize;
      });

      // Bird -> Birdday -> Birthday! word-jump timed across the 0.5s flight
      setTimeout(()=>{ birdFlyer.textContent = 'Birdday'; }, 750);
      setTimeout(()=>{ birdFlyer.textContent = 'Birthday!'; }, 1400);

      // 6) once it lands, swap in the real target spans and reveal the rest
      setTimeout(() => {
        loveFlyer.remove();
        birdFlyer.remove();
        loveTargetEl.classList.add('shown');
        birdTargetEl.classList.add('shown');

        const others = Array.from(headline.querySelectorAll('span')).filter(s => s !== loveTargetEl && s !== birdTargetEl);
        others.forEach((el, i) => {
          setTimeout(()=> el.classList.add('shown'), i * 100);
        });

        setTimeout(()=>{
          subline.classList.add('shown');
        }, 1200);

        setTimeout(()=>{
          subline2.classList.add('shown');
        }, 2200);

        // shortly after the last text (subline2) appears, show the Then/Now interlude
        setTimeout(showThenNow, 2200 + 1500);
      }, 1950);
    });
  }

  // ---------- Finale: blackout, confetti, danmaku, disco, gifs ----------
  const finale = document.getElementById('finale');
  const gifSlots = Array.from(document.querySelectorAll('.gif-slot'));
  const gifUrls = [1,2,3,4,5,6].map(n => `https://raw.githubusercontent.com/phuongm1409/bird/main/${n}.gif`);
  const brightColors = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#ff4dd8','#3ddc97'];
  const danmakuMessages = [
    'Happy Birthday huchu',
    'Chúc mừng sinh nhật huchu',
    '생일 축하해 huchu',
    'Chucs muwng sinh nhaajt huchu',
    'Sinh nhật vui vẻ',
    '생일 축하합니다',
    'Ngày mới an lành',
    'Hpbd huchu',
    '24 tuổi rồi nhé',
    '24살 축하해',
    'Happy 24th!',
    '07.09.2002',
    '07/09/2002',
    'Sep 7'
  ];

  let finaleActive = false;
  let confettiTimer = null;
  let danmakuTimer = null;

  function spawnConfetti(){
    const layer = document.getElementById('confetti-layer');
    if(layer.children.length >= 40) return; // hard cap to avoid runaway buildup

    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const w = 6 + Math.random() * 6;
    const h = w * (1.4 + Math.random() * 0.6);
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.background = brightColors[Math.floor(Math.random() * brightColors.length)];
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    const duration = 4 + Math.random() * 4;
    el.style.animationDuration = duration + 's';
    el.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
    el.style.setProperty('--rot', (720 + Math.random() * 720) + 'deg');
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function spawnDanmaku(){
    const layer = document.getElementById('danmaku-layer');
    if(layer.children.length >= 12) return; // hard cap to avoid runaway buildup

    const el = document.createElement('div');
    el.className = 'danmaku-item';
    el.textContent = danmakuMessages[Math.floor(Math.random() * danmakuMessages.length)];
    el.style.top = (5 + Math.random() * 85) + 'vh';
    el.style.fontSize = (20 + Math.random() * 26) + 'px';
    el.style.color = brightColors[Math.floor(Math.random() * brightColors.length)];
    const duration = 6 + Math.random() * 5;
    el.style.animationDuration = duration + 's';
    layer.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function runGifSlot(slotEl){
    function cycle(){
      if(!finaleActive) return;
      const url = gifUrls[Math.floor(Math.random() * gifUrls.length)];
      slotEl.src = url;
      const size = 110 + Math.random() * 90;
      slotEl.style.width = size + 'px';
      slotEl.style.top = (Math.random() * 65 + 5) + 'vh';
      slotEl.style.left = (Math.random() * 70 + 5) + 'vw';
      slotEl.style.opacity = '1';
      const visibleDuration = 1100 + Math.random() * 900;
      setTimeout(() => {
        slotEl.style.opacity = '0';
        const hiddenDuration = 300 + Math.random() * 800;
        setTimeout(cycle, hiddenDuration);
      }, visibleDuration);
    }
    // stagger the initial start so slots don't sync up
    setTimeout(cycle, Math.random() * 700);
  }

  function startFinale(){
    // starts once the video shrinks: disco background + confetti + wishes flying + gifs,
    // all running alongside the still-playing loopy.mp4 (no separate background music)
    finaleActive = true;
    document.getElementById('disco-layer').classList.add('active');

    bgm.pause();

    spawnConfetti();
    confettiTimer = setInterval(spawnConfetti, 180);
    spawnDanmaku();
    danmakuTimer = setInterval(spawnDanmaku, 800);

    gifSlots.forEach(runGifSlot);
  }

  function showThenNow(){
    const nowEl = document.getElementById('now-item');
    const video = document.getElementById('now-video');

    // Phase 1: fade the whole screen to black first
    finale.classList.add('active');

    // Phase 2: once black, fade in and start playing loopy.mp4
    setTimeout(() => {
      nowEl.classList.add('shown');
      video.muted = false;
      video.playsInline = true;
      video.currentTime = 0;
      video.play().catch(()=>{ /* ignored if browser blocks autoplay */ });
    }, 600);

    // Phase 3: after 3s of playback, shrink the video to 50% and let the party begin around it
    setTimeout(() => {
      nowEl.classList.add('shrunk');
      startFinale();
    }, 600 + 3000);
  }

  function finishExperience(){
    // loopy.mp4 has ended — stop the party visuals and fade to black for good (no restart)
    finaleActive = false;
    clearInterval(confettiTimer); confettiTimer = null;
    clearInterval(danmakuTimer); danmakuTimer = null;
    document.getElementById('confetti-layer').innerHTML = '';
    document.getElementById('danmaku-layer').innerHTML = '';
    gifSlots.forEach(el => { el.style.opacity = '0'; el.src = ''; });
    document.getElementById('disco-layer').classList.remove('active');
    document.getElementById('now-item').classList.remove('shown');
    document.getElementById('now-item').classList.remove('shrunk');
  }

  document.getElementById('now-video').addEventListener('ended', finishExperience);

  function resetToStart(){
    finaleActive = false;
    finale.classList.remove('active');
    document.getElementById('disco-layer').classList.remove('active');

    clearInterval(confettiTimer); confettiTimer = null;
    clearInterval(danmakuTimer); danmakuTimer = null;
    document.getElementById('confetti-layer').innerHTML = '';
    document.getElementById('danmaku-layer').innerHTML = '';
    gifSlots.forEach(el => { el.style.opacity = '0'; el.src = ''; });
    document.getElementById('now-item').classList.remove('shown');
    document.getElementById('now-item').classList.remove('shrunk');
    const nowVideo = document.getElementById('now-video');
    nowVideo.pause();
    nowVideo.currentTime = 0;

    clearInterval(heartsTimer); heartsTimer = null;
    document.getElementById('hearts').innerHTML = '';
    document.querySelector('.bg-photo').classList.remove('active');

    // reset the quiz slides so the site can be replayed
    questions.forEach(q => {
      const slideEl = document.getElementById(q.slideId);
      const options = slideEl.querySelectorAll('.mc-option');
      const feedback = slideEl.querySelector('.feedback');
      options.forEach(o => {
        o.disabled = false;
        o.classList.remove('correct', 'wrong', 'shake');
      });
      feedback.textContent = '';
      feedback.className = 'feedback';
    });

    document.getElementById('reveal-text').innerHTML = '';
    document.getElementById('final-headline').innerHTML = '';
    document.getElementById('subline').classList.remove('shown');
    document.getElementById('subline2').classList.remove('shown');

    goToSlide('slide-q1');
  }
})();
</script>
</body>
</html>
